spring.application.name=shop
## DataSource: prefer provided JDBC/Heroku-style env vars, otherwise fall back to H2 in-memory
# Supports: `JDBC_DATABASE_URL`, `SPRING_DATASOURCE_URL`, `DATABASE_URL` (Postgres),
# if none present the app will use an in-memory H2 DB so it can start in environments without Postgres
spring.datasource.url=${JDBC_DATABASE_URL:${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:h2:mem:shopdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}}}
## Default username/password: if Postgres env not set, H2 uses 'sa' with empty password
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:sa}}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:}}}
## Do not hardcode driver-class-name; allow Spring Boot to detect driver from JDBC URL
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
server.port=${PORT:10000}

# Let Hibernate detect dialect automatically when possible; explicit fallback kept
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
jakarta.persistence.jdbc.url=${spring.datasource.url}
