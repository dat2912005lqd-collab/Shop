spring.application.name=shop
spring.datasource.url=${JDBC_DATABASE_URL:${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/shopdb}}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:postgres}}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:123456}}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
server.port=${PORT:10000}

# Explicitly set Hibernate dialect to avoid "Unable to determine Dialect" errors
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Provide Jakarta persistence URL fallback to ensure JDBC URL is visible to Hibernate
jakarta.persistence.jdbc.url=${spring.datasource.url}
